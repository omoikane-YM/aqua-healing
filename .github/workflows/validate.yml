name: Validate site metadata

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate sitemap and published URLs
        run: node scripts/validate-site-map.mjs

      - name: Audit static SEO metadata and structure
        run: node scripts/audit-seo.mjs
